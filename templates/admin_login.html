<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Hotel Skymar | Login Administrador</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main style="padding: 80px 7%; display: flex; justify-content: center;">
        <div style="background: white; padding: 40px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 400px; width: 100%;">
            <h2 style="color: var(--navy); text-align: center; margin-bottom: 20px;">Panel Administrador</h2>
            
            <form action="/admin/login" method="POST">
                <div style="margin-bottom: 15px;">
                    <label style="font-weight: bold; color: var(--navy);">Correo:</label>
                    <input type="email" name="correo" required value="admin@skymar.com" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="font-weight: bold; color: var(--navy);">Contraseña:</label>
                    <input type="password" name="password" required value="Admin123" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc;">
                </div>
                <button type="submit" class="button" style="width: 100%; background: var(--navy); padding: 12px; margin-bottom: 10px;">Ingresar</button>
                <a href="/" style="display: block; text-align: center; color: var(--muted); text-decoration: none; font-size: 0.9rem;">Volver al sitio web</a>
            </form>
        </div>
    </main>
</body>
</html>
